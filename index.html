<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lily's 22nd Birthday 🎀</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <audio id="birthdaySong" src="audio/birthday.mp3" preload="auto"></audio>

    <main class="birthday">

        <div id="candyRain"></div>
        <h1 class="birthday-title">HAPPY 22ND BIRTHDAY!</h1>
        <p class="subtitle">A little cake made just for Lily ♡</p>

        <div class="cake">
            <div class="candles" id="candles"></div>

            <div class="cake-top"></div>
            <div class="cake-body">
                <div class="frosting"></div>
                <div class="bow bow-left">🎀</div>
                <div class="bow bow-right">🎀</div>
                <div class="pearls">♡ · ♡ · ♡ · ♡</div>
            </div>

            <div class="cake-plate"></div>
        </div>

        <button id="blowButton">Blow out the candles ✨</button>

        <h2 id="message"></h2>
    </main>

    <script src="script.js"></script>
</body>
</html>
